<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ponder verify fixture</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4a6aa0; font-family: monospace; color: #fff; }
  body { background: linear-gradient(#34508c, #5f84b8 55%, #3d5a2c 56%); }
  #stage { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #title { position: fixed; left: 24px; top: 20px; font-size: 28px; text-shadow: 2px 2px #000; max-width: 70vw; }
  #text { position: fixed; right: 24px; top: 40%; max-width: 30vw; padding: 8px 12px; background: #000c; border: 2px solid #432; font-size: 20px; }
  #text:empty { display: none; }
  #bar { position: fixed; left: 26%; right: 26%; bottom: 60px; height: 10px; background: #000; border: 2px solid #335; cursor: pointer; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #aad8; pointer-events: none; }
  .mark { position: absolute; top: -4px; width: 2px; height: 16px; background: #ffe; pointer-events: none; }
  #buttons { position: fixed; left: 0; right: 0; bottom: 8px; display: flex; gap: 10px; justify-content: center; }
  button { width: 48px; height: 44px; font: 20px monospace; background: #000; color: #fff; border: 2px solid #557; cursor: pointer; }
  #browser { position: fixed; left: 8%; right: 8%; top: 12%; bottom: 20%; background: #101828f0; border: 2px solid #88a; padding: 12px; overflow: auto; }
  #browser[hidden] { display: none; }
  #browser input { width: 100%; box-sizing: border-box; font: 20px monospace; padding: 6px; }
  #results { list-style: none; padding: 0; margin: 10px 0 0; }
  #results li { padding: 8px; border-bottom: 1px solid #334; cursor: pointer; }
  #results li:hover { background: #223; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" data-testid="scene-canvas"></canvas></div>
<div id="title" data-testid="ponder-title"></div>
<div id="text" data-testid="ponder-text"></div>
<div id="bar" data-testid="progress-bar"><div id="fill"></div></div>
<div id="buttons">
  <button data-testid="btn-close" title="close">X</button>
  <button data-testid="btn-scene-browser" title="scene browser">Q</button>
  <button data-testid="btn-prev" title="previous scene">&lt;</button>
  <button data-testid="btn-next" title="next scene">&gt;</button>
  <button data-testid="btn-replay" title="replay">R</button>
</div>
<div id="browser" data-testid="scene-browser" hidden>
  <input data-testid="scene-search" placeholder="search scenes" autocomplete="off">
  <ul id="results"></ul>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
